<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rumbo · Portal de Trabajo</title>
  <!-- Bootstrap 5 (estilos) y fuente Space Grotesk, ambos por CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <!-- Nuestros estilos van DESPUÉS de Bootstrap para poder sobreescribirlo -->
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Todo el sitio se dibuja dentro de este div (SPA: una sola página) -->
  <div id="app"></div>

  <!-- Aviso emergente reutilizable (lo usa la función aviso() de app.js) -->
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div id="toast" class="toast text-bg-dark" role="alert"><div class="toast-body"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- El orden importa: cada archivo usa lo que definió el anterior -->
  <script src="js/db.js"></script>      <!-- 1. datos (localStorage) -->
  <script src="js/api.js"></script>     <!-- 2. API externa -->
  <script src="js/vistas.js"></script>  <!-- 3. HTML de cada pantalla -->
  <script src="js/app.js"></script>     <!-- 4. rutas, formularios y acciones -->
</body>
</html>
